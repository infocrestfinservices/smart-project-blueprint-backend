# Nginx site for ReportCraft.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/reportcraft
#   sudo ln -s /etc/nginx/sites-available/reportcraft /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace REPLACE_DOMAIN with your domain before copying. certbot rewrites this file to add
# the TLS block and the port-80 redirect, so run it AFTER this is in place and working.

server {
    listen 80;
    server_name REPLACE_DOMAIN www.REPLACE_DOMAIN;

    # The built frontend. Vite emits a single index.html plus hashed assets; every unknown
    # path falls back to index.html because the routing happens in the browser.
    root /opt/reportcraft/frontend/dist;
    index index.html;

    # Hashed filenames can be cached for ever; index.html must never be, or a deploy leaves
    # browsers holding the old shell that points at assets which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API. Everything the frontend calls lives under these prefixes.
    # Every prefix the app actually serves. Checked against the router table rather than
    # written from memory — /ai and /analysis were missing on the first pass, and a route
    # absent here does not 404: nginx serves index.html instead, so the browser gets HTML
    # where it expected JSON and the error makes no sense.
    location ~ ^/(auth|projects|generate|payments|invoices|admin|templates|industries|countries|purposes|health|docs|openapi\.json|bank-loan|engine-test|ai|analysis)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A long report holds the connection open for five to seven minutes. The default 60s
        # would cut it off and hand the customer a 504 while the work was still running.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Uploaded logos and section photos.
        client_max_body_size 25m;

        # Workbooks and PDFs stream out; buffering them would hold a whole file in memory.
        proxy_buffering off;
    }
}
